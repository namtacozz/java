      container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
      document.body.appendChild(container);

      const colors = ['#10B981', '#34D399', '#F59E0B', '#E0562D', '#3B82F6', '#8B5CF6'];
      const count = 16;

      for (let i = 0; i < count; i++) {
        const dot = document.createElement('div');
        const angle = (i / count) * 2 * Math.PI + (Math.random() * 0.4 - 0.2);
        const distance = 50 + Math.random() * 65;
        const destX = Math.cos(angle) * distance;
        const destY = Math.sin(angle) * distance - 25;
        const color = colors[i % colors.length];
        const size = 6 + Math.random() * 5;

        dot.style.cssText = `
          position: fixed;
          left: ${startX}px;
          top: ${startY}px;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          border-radius: 50%;
          pointer-events: none;
          transform: translate(-50%, -50%) scale(0.6);
          opacity: 1;
          transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.65s ease-out;
        `;
        container.appendChild(dot);

        requestAnimationFrame(() => {
          dot.style.transform = `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(1)`;
          dot.style.opacity = '0';
        });
      }

      setTimeout(() => {
        container.remove();
      }, 700);
    }

    // =========================================================================
    // Quote VFX Engine (Large Arched Vector Typography & Bobbing Pulse VFX)
    // =========================================================================
    const QUOTE_GRADIENT_SETS = [
      ['#FF416C', '#FF4B2B', '#F9CA24'],
      ['#7F00FF', '#E100FF', '#00F2FE'],
      ['#FF0844', '#FFB199', '#FFE66D'],
      ['#00F2FE', '#4FACFE', '#00C9FF'],
      ['#F368E0', '#FF9F43', '#FF5252'],
      ['#10B981', '#3B82F6', '#8B5CF6'],
      ['#F72585', '#7209B7', '#4CC9F0'],
      ['#FF8A00', '#E52E71', '#9B51E0']
    ];

    let lastPickedQuote = '';
    let autoHideQuoteTimer = null;

    function getRandomQuote(isCorrect) {
      const quotesObj = (window.VIT_QUOTES && typeof window.VIT_QUOTES === 'object')
        ? window.VIT_QUOTES
        : { correct: [], wrong: [], anytime: [] };

      const specificPool = isCorrect ? (quotesObj.correct || []) : (quotesObj.wrong || []);
      const anytimePool = quotesObj.anytime || [];
      const combinedPool = [...specificPool, ...anytimePool];

      if (combinedPool.length === 0) {
        return isCorrect ? "BẠN THẬT TÀY ĐẤY?" : "ĐẦU TRÂU?";
      }

      // Filter out the last picked quote if possible to avoid immediate repeating
      const eligiblePool = combinedPool.length > 1
        ? combinedPool.filter(q => q !== lastPickedQuote)
        : combinedPool;

      const picked = eligiblePool[Math.floor(Math.random() * eligiblePool.length)];
      lastPickedQuote = picked;
      return picked;
    }

    function showQuoteBanner(isCorrect) {
      const stage = document.getElementById('quote-vfx-stage');
      if (!stage) return;

      if (autoHideQuoteTimer) {
        clearTimeout(autoHideQuoteTimer);
        autoHideQuoteTimer = null;
      }

      const quote = getRandomQuote(isCorrect);
      const colors = QUOTE_GRADIENT_SETS[Math.floor(Math.random() * QUOTE_GRADIENT_SETS.length)];

      // Dynamic font sizing: Short quotes are huge, long quotes stay on the arc comfortably
      let fontSize = 38;
      if (quote.length <= 14) {
        fontSize = 46;
      } else if (quote.length <= 24) {
        fontSize = 38;
      } else if (quote.length <= 34) {
        fontSize = 32;
      } else {
        fontSize = 26;
      }

      const uniqueSuffix = Date.now();
      const gradId = `quoteArcGrad_${uniqueSuffix}`;
      const curveId = `quoteArcCurve_${uniqueSuffix}`;

      // Render arched typography along the rainbow curve _.===._
      stage.innerHTML = `
        <svg viewBox="0 0 860 160" class="quote-arc-svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="${colors[0]}" />
              <stop offset="50%" stop-color="${colors[1]}" />
              <stop offset="100%" stop-color="${colors[2]}" />
            </linearGradient>
            <path id="${curveId}" d="M 35 140 Q 430 14 825 140" fill="none" />
          </defs>
          <text class="quote-arc-text" font-size="${fontSize}px" fill="url(#${gradId})">
            <textPath href="#${curveId}" xlink:href="#${curveId}" startOffset="50%" text-anchor="middle">
              ${escapeHtml(quote)}
            </textPath>
          </text>
        </svg>
      `;

      // Trigger animation
      stage.classList.remove('active', 'shake', 'is-fading');
      void stage.offsetWidth; // Reflow to reset transition/animations

      stage.classList.add('active');
      if (!isCorrect) {
        stage.classList.add('shake');
      }
      // Quote stays active and pulsating until user advances to next question (renderCurrentQuestion calls hideQuoteBanner)
    }

    function hideQuoteBanner() {
      const stage = document.getElementById('quote-vfx-stage');
      if (!stage) return;
      if (autoHideQuoteTimer) {
        clearTimeout(autoHideQuoteTimer);
        autoHideQuoteTimer = null;
      }
      stage.classList.remove('active', 'shake', 'is-fading');
      stage.innerHTML = '';
    }

    // =========================================================================
    // Timer & Reset Logic (Bottom-Left Secondary Actions)
    // =========================================================================
    let timerSeconds = 0;
    let isTimerRunning = true; // Mặc định tự động đếm giờ từ khi mở web
    let timerInterval = null;

    const CLOCK_ICON_SVG = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    `;

    const MINI_CLOCK_ICON_SVG = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    `;

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const mm = String(mins).padStart(2, '0');
      const ss = String(secs).padStart(2, '0');
      if (hrs > 0) {
        const hh = String(hrs).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      }
      return `${mm}:${ss}`;
    }

    function renderTimerUI() {
      const btn = document.getElementById('btn-timer-toggle');
      if (!btn) return;

      if (isTimerRunning) {
        // Khi thời gian đang chạy: tự động hiển thị số thời gian đếm
        btn.classList.add('is-counting');
        btn.innerHTML = `${MINI_CLOCK_ICON_SVG}<span class="timer-digits">${formatTime(timerSeconds)}</span>`;
        btn.title = "Đang đếm giờ (Click để đặt về 0 và dừng lại)";
        btn.setAttribute('aria-label', `Thời gian làm bài: ${formatTime(timerSeconds)}`);
      } else {
        // Khi dừng: trở về icon đồng hồ
        btn.classList.remove('is-counting');
        btn.innerHTML = CLOCK_ICON_SVG;
        btn.title = "Đồng hồ đang dừng (Click để bắt đầu đếm từ 00:00)";
        btn.setAttribute('aria-label', 'Bắt đầu tính giờ');
      }
    }

    function toggleTimer() {
      SoundFX.click();
      if (isTimerRunning) {
        // Đang chạy -> ấn vào đặt thời gian về 0 và trở về icon đồng hồ
        timerSeconds = 0;
        isTimerRunning = false;
      } else {
        // Đang dừng ở icon đồng hồ -> ấn vào lại thì lại đếm từ 0
        timerSeconds = 0;
        isTimerRunning = true;
      }
      renderTimerUI();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isTimerRunning) {
          timerSeconds++;
          renderTimerUI();
        }
      }, 1000);
      renderTimerUI();
    }

    function resetExam() {
      SoundFX.click();
      if (confirm('Bạn có chắc chắn muốn xoá toàn bộ lịch sử câu hỏi đã làm và làm lại từ đầu không?')) {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}

        // Reset toàn bộ dữ liệu câu hỏi đã làm để trống không như mới
        BENCHMARK_QUESTIONS.forEach(q => {
          questionStatus[q.id] = 'unanswered';
        });
        for (const key of Object.keys(userSelections)) {
          delete userSelections[key];
        }
        currentQuestionIndex = 0;
        isAnswerVerified = false;

        // Reset đồng hồ tự động đếm về 00:00
        timerSeconds = 0;
        isTimerRunning = true;
        renderTimerUI();

        hideQuoteBanner();
        saveStateToStorage();
        renderCurrentQuestion();
      }
    }

    const CHECK_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    function renderCurrentQuestion() {
      hideQuoteBanner();
      const q = BENCHMARK_QUESTIONS[currentQuestionIndex];
      const card = document.getElementById('question-card');

      // Adaptive layout: expand width only for questions with code or image
      const container = document.querySelector('.test-container');
      if (container) {
        if (q.code || q.image) {
          container.classList.add('has-media-layout');
        } else {
          container.classList.remove('has-media-layout');
        }
      }
      const progressText = document.getElementById('progress-text');
      const progressFill = document.getElementById('progress-fill');
      const progressTag = document.getElementById('progress-tag');

      // Ensure a Set exists for current question
      if (!userSelections[q.id]) {
        userSelections[q.id] = new Set();
      }

      const isAlreadyVerified = (questionStatus[q.id] !== 'unanswered');

      // Update Header Progress
      if (progressText) progressText.textContent = `Câu ${currentQuestionIndex + 1} / ${BENCHMARK_QUESTIONS.length}`;
      if (progressFill) progressFill.style.width = `${((currentQuestionIndex + 1) / BENCHMARK_QUESTIONS.length) * 100}%`;
      if (progressTag) progressTag.textContent = q.chapterTag || "Ôn tập Java";

      // Left column: Chapter Badge, Title, Code / Image
      let leftHtml = `
        <div class="question-left-col">
          <div class="question-subject-badge">${escapeHtml(q.chapter || "Java Core")}</div>
          <h2 class="question-title">${escapeHtml(q.title)}</h2>
      `;

      if (q.code) {
        leftHtml += `
          <div class="code-box">
            <pre><code>${escapeHtml(q.code)}</code></pre>
          </div>
        `;
      }

      if (q.image) {
        leftHtml += `
          <div class="question-image-wrapper">
            <img src="${q.image}" alt="Đoạn mã câu hỏi" class="question-image" onclick="openLightbox('${q.image}')" />
          </div>
        `;
      }

      leftHtml += `</div>`;

      // Right column: Options List (No explanation box)
      const promptText = q.prompt || (q.isMultiple ? "Chọn các phương án đúng:" : "Chọn một phương án đúng nhất:");
      let rightHtml = `
        <div class="question-right-col">
          <div class="options-header-prompt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <span>${escapeHtml(promptText)}</span>
          </div>
      `;

      if (q.options && q.options.length) {
        rightHtml += `<div class="options-list" id="options-container">`;
        q.options.forEach(opt => {
          const isSelected = userSelections[q.id].has(opt.label);
          let rowClasses = ['option-row'];
          let verdictText = '';
          let badgeHtml = isSelected ? CHECK_SVG : opt.label;

          if (isSelected) {
            rowClasses.push('is-selected');
          }

          if (isAlreadyVerified) {
            const evalResult = getOptionEvaluation(q, opt.label, isSelected);
            rowClasses.push(evalResult.rowClass);
            verdictText = evalResult.verdictText;
            badgeHtml = evalResult.badgeContent;
          }

          const cleanText = opt.text.replace(/^[A-Ga-g]\.\s*/, '');
          rightHtml += `
            <div class="${rowClasses.join(' ')}" data-label="${opt.label}">
              <div class="option-badge" id="badge-${opt.label}">
                ${badgeHtml}
              </div>
              <div class="option-text">${escapeHtml(cleanText)}</div>
              <span class="verdict-tag" id="verdict-${opt.label}">${verdictText}</span>
            </div>
          `;
        });
        rightHtml += `</div>`;
      }

      rightHtml += `</div>`;

      card.innerHTML = `<div class="question-grid-layout">${leftHtml}${rightHtml}</div>`;

      // Re-trigger smooth card transition VFX
      card.classList.remove('animating-in');
      void card.offsetWidth;
      card.classList.add('animating-in');

      isAnswerVerified = isAlreadyVerified;
      updateMainActionButtonState();
      bindOptionClickEvents(q);
      renderMapGrid();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /**
     * Binds click handlers to toggle badge between letter and checkmark
     */
    function bindOptionClickEvents(q) {
      const container = document.getElementById('options-container');
      if (!container) return;

      const rows = container.querySelectorAll('.option-row');
      rows.forEach(row => {
        row.addEventListener('click', (e) => {
          // If answer was already verified, lock options
          if (isAnswerVerified) return;

          // If user was selecting/highlighting text, do not toggle
          const selection = window.getSelection();
          if (selection && selection.toString().trim().length > 0) {
            return;
          }

          SoundFX.boop();

          const label = row.getAttribute('data-label');
          const badge = document.getElementById(`badge-${label}`);

          if (userSelections[q.id].has(label)) {
            userSelections[q.id].delete(label);
            row.classList.remove('is-selected');
            if (badge) badge.textContent = label;
          } else {
            // If single-choice question and not multiple, clear other selections
            if (!q.isMultiple) {
              userSelections[q.id].clear();
              rows.forEach(r => {
                r.classList.remove('is-selected');
                const b = r.querySelector('.option-badge');
                if (b) b.textContent = r.getAttribute('data-label');
              });
            }
            userSelections[q.id].add(label);
            row.classList.add('is-selected');
            if (badge) badge.innerHTML = CHECK_SVG;
          }
          saveStateToStorage();
          updateMainActionButtonState();
        });
      });
    }

    /**
     * Updates the unified footer action button:
     * - !isAnswerVerified: label "Xác nhận", checkmark icon, disabled if no option selected
     * - isAnswerVerified: label "Tiếp theo" (or "Hoàn tất & Về trang chủ" on last question), arrow icon
     */
    function updateMainActionButtonState() {
      const btnMainAction = document.getElementById('btn-main-action');
      const btnText = document.getElementById('btn-action-text');
      const btnIcon = document.getElementById('btn-action-icon');
      const btnPrev = document.getElementById('btn-prev-question');
      if (!btnText || !btnIcon || !btnMainAction) return;

      const q = BENCHMARK_QUESTIONS[currentQuestionIndex];
      const selected = userSelections[q.id] || new Set();

      if (btnPrev) {
        btnPrev.disabled = (currentQuestionIndex === 0);
        btnPrev.style.visibility = (currentQuestionIndex === 0) ? 'hidden' : 'visible';
      }

      if (!isAnswerVerified) {
        btnText.textContent = "Xác nhận";
        btnIcon.innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
        btnMainAction.disabled = (selected.size === 0);
      } else {
        btnMainAction.disabled = false;
        if (currentQuestionIndex === BENCHMARK_QUESTIONS.length - 1) {
          btnText.textContent = "Hoàn tất & Về trang chủ";
        } else {
          btnText.textContent = "Tiếp theo";
        }
        btnIcon.innerHTML = `<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>`;
      }
    }

    /**
     * Evaluates an option's visual state based on question type and selections:
     * - Multi-choice:
     *   - Picked & correct: green "Đúng ✓", checkmark
     *   - Not picked & correct (chọn thiếu): red "Thiếu ✗", letter
     *   - Picked & not correct (chọn thừa / sai): red "Thừa ✗", checkmark
     *   - Not picked & not correct: neutral, no tag, letter
     * - Single-choice:
     *   - Picked & correct: green "Đúng ✓", checkmark
     *   - Picked & not correct: red "Sai ✗", checkmark
     *   - Not picked & correct: green "Đúng ✓", letter
     *   - Not picked & not correct: neutral, no tag, letter
     */
    function getOptionEvaluation(q, label, isSelected) {
      const correctSet = new Set(q.correctAnswers || []);
      const isCorrectOption = correctSet.has(label);

      if (q.isMultiple) {
        if (isCorrectOption && isSelected) {
          return { rowClass: 'verified-correct', verdictText: 'Đúng ✓', badgeContent: CHECK_SVG };
        } else if (isCorrectOption && !isSelected) {
          return { rowClass: 'verified-wrong', verdictText: 'Thiếu ✗', badgeContent: label };
        } else if (!isCorrectOption && isSelected) {
          return { rowClass: 'verified-wrong', verdictText: 'Thừa ✗', badgeContent: CHECK_SVG };
        } else {
          return { rowClass: 'verified-neutral-wrong', verdictText: '', badgeContent: label };
        }
      } else {
        if (isSelected && isCorrectOption) {
          return { rowClass: 'verified-correct', verdictText: 'Đúng ✓', badgeContent: CHECK_SVG };
        } else if (isSelected && !isCorrectOption) {
          return { rowClass: 'verified-wrong', verdictText: 'Sai ✗', badgeContent: CHECK_SVG };
        } else if (!isSelected && isCorrectOption) {
          return { rowClass: 'verified-correct', verdictText: 'Đúng ✓', badgeContent: label };
        } else {
          return { rowClass: 'verified-neutral-wrong', verdictText: '', badgeContent: label };
        }
      }
    }

    /**
     * Executes verification for the current question:
     * Highlights options (green for correct picked, red for missed/excess, neutral for unpicked wrong).
     */
    function verifyCurrentQuestion() {
      const q = BENCHMARK_QUESTIONS[currentQuestionIndex];
      const selectedSet = userSelections[q.id];
      if (!selectedSet || selectedSet.size === 0) return;
      const correctSet = new Set(q.correctAnswers || []);

      // Check correctness: exact match with no missing and no excess options
      const isCorrect = (selectedSet.size === correctSet.size) &&
                        ([...selectedSet].every(item => correctSet.has(item)));

      questionStatus[q.id] = isCorrect ? 'correct' : 'wrong';

      if (isCorrect) {
        SoundFX.correct();
        triggerConfettiBurst(document.getElementById('btn-main-action'));
      } else {
        SoundFX.wrong();
      }

      showQuoteBanner(isCorrect);

      // Evaluate each option row
      const rows = document.querySelectorAll('.option-row');
      rows.forEach(row => {
        const label = row.getAttribute('data-label');
        const isUserPicked = selectedSet.has(label);
        const evalResult = getOptionEvaluation(q, label, isUserPicked);
        const verdictSpan = document.getElementById(`verdict-${label}`);
        const badge = document.getElementById(`badge-${label}`);

        row.classList.remove('verified-correct', 'verified-wrong', 'verified-neutral-wrong');
        row.classList.add(evalResult.rowClass);

        if (verdictSpan) {
          verdictSpan.textContent = evalResult.verdictText;
        }
        if (badge) {
          badge.innerHTML = evalResult.badgeContent;
        }
      });

      isAnswerVerified = true;
      updateMainActionButtonState();
      renderMapGrid();
      saveStateToStorage();
    }

    /**
     * Jump directly to a question by index while preserving state
     */
    function goToQuestion(index) {
      if (index < 0 || index >= BENCHMARK_QUESTIONS.length) return;
      SoundFX.click();
      currentQuestionIndex = index;
      saveStateToStorage();
      renderCurrentQuestion();
    }
    window.goToQuestion = goToQuestion;

    /**
     * Renders question map cells grouped by chapter in the hover popover
     */
    function renderMapGrid() {
      const scrollArea = document.getElementById('map-scroll-area');
      const progressCount = document.getElementById('map-progress-count');
      if (!scrollArea) return;

      let answeredCount = 0;
      BENCHMARK_QUESTIONS.forEach(q => {
        if (questionStatus[q.id] !== 'unanswered') answeredCount++;
      });

      // Group questions by chapter
      const chapters = [];
      let currentChapter = null;
      BENCHMARK_QUESTIONS.forEach((q, idx) => {
        if (!currentChapter || currentChapter.name !== q.chapter) {
          currentChapter = { name: q.chapter, questions: [] };
          chapters.push(currentChapter);
        }
        currentChapter.questions.push({ q, idx });
      });

      let html = '';
      chapters.forEach(ch => {
        html += `<div class="chapter-section-header">
          <span>${escapeHtml(ch.name)}</span>
          <span>${ch.questions.length} câu</span>
        </div>`;
        html += `<div class="map-grid">`;
        ch.questions.forEach(item => {
          const status = questionStatus[item.q.id] || 'unanswered';
          const isCurrent = (item.idx === currentQuestionIndex);
          html += `
            <button type="button" class="map-cell status-${status} ${isCurrent ? 'is-current' : ''}" 
                    data-q-index="${item.idx}"
                    onclick="window.goToQuestion(${item.idx})" 
                    aria-label="Đến câu ${item.q.id}">
              ${item.q.id}
            </button>
          `;
        });
        html += `</div>`;
      });

      scrollArea.innerHTML = html;
      if (progressCount) {
        progressCount.textContent = `${answeredCount}/${BENCHMARK_QUESTIONS.length}`;
      }
    }

    /**
     * Floating Mini-Screen Question Preview on Hover in Map Popover
     */
    function initMapHoverPreview() {
      const scrollArea = document.getElementById('map-scroll-area');
      const previewCard = document.getElementById('map-question-preview');
      const mapPopover = document.getElementById('map-popover');
      const chapterEl = document.getElementById('map-preview-chapter');
      const statusEl = document.getElementById('map-preview-status');
      const titleEl = document.getElementById('map-preview-title');
      const mediaEl = document.getElementById('map-preview-media');

      if (!scrollArea || !previewCard || !mapPopover) return;

      function hidePreview() {
        previewCard.classList.remove('is-visible');
      }

      scrollArea.addEventListener('mouseover', (e) => {
        const cell = e.target.closest('.map-cell');
        if (!cell) return;

        const idxAttr = cell.getAttribute('data-q-index');
        if (idxAttr === null) return;
        const idx = Number(idxAttr);
        const q = BENCHMARK_QUESTIONS[idx];
        if (!q) return;

        // Populate chapter
        if (chapterEl) {
          chapterEl.textContent = q.chapterTag || q.chapter || 'Ôn tập';
        }

        // Populate status
        const status = questionStatus[q.id] || 'unanswered';
        if (statusEl) {
          statusEl.className = 'map-preview-status';
          if (status === 'correct') {
            statusEl.classList.add('is-correct');
            statusEl.textContent = 'Đúng ✓';
          } else if (status === 'wrong') {
            statusEl.classList.add('is-wrong');
            statusEl.textContent = 'Sai ✗';
          } else {
            statusEl.classList.add('is-unanswered');
            statusEl.textContent = 'Chưa làm';
          }
        }

        // Populate title (stem only, NO options)
        if (titleEl) {
          titleEl.textContent = q.title || `Câu ${q.id}`;
        }

        // Populate media
        if (mediaEl) {
          if (q.code) {
            mediaEl.style.display = 'block';
            mediaEl.innerHTML = `<pre class="map-preview-code"><code>${escapeHtml(q.code)}</code></pre>`;
          } else if (q.image) {
            mediaEl.style.display = 'block';
            mediaEl.innerHTML = `<img src="${escapeHtml(q.image)}" alt="Thumbnail câu hỏi" class="map-preview-thumb" />`;
          } else {
            mediaEl.style.display = 'none';
            mediaEl.innerHTML = '';
          }
        }

        // Dynamic Vertical Tracking:
        // Position relative to mapPopover: align preview vertically near hovered cell without overflowing
        const cellRect = cell.getBoundingClientRect();
        const popRect = mapPopover.getBoundingClientRect();
        const previewHeight = previewCard.offsetHeight || 220;

        // Distance from bottom of mapPopover to the cell's center
        const cellCenterFromPopBottom = popRect.bottom - (cellRect.top + cellRect.height / 2);
        let bottomOffset = cellCenterFromPopBottom - (previewHeight / 2);

        // Clamp so it never extends below popover bottom (0px) or above popover top
        const minBottom = 0;
        const maxBottom = Math.max(0, popRect.height - previewHeight);
        bottomOffset = Math.max(minBottom, Math.min(maxBottom, bottomOffset));

        previewCard.style.bottom = `${bottomOffset}px`;
        previewCard.classList.add('is-visible');
      });

      scrollArea.addEventListener('mouseleave', hidePreview);

      // Hide when clicking cell
      scrollArea.addEventListener('click', (e) => {
        if (e.target.closest('.map-cell')) {
          hidePreview();
        }
      });

      // Hide when popover loses hover or closes
      mapPopover.addEventListener('mouseleave', hidePreview);
    }

    /**
     * Handles clicking the unified action button:
     * 1st click: verifies answer & changes label to "Tiếp theo"
     * 2nd click: advances to next question or finishes to index.html
     */
    function handleMainAction() {
      if (!isAnswerVerified) {
        verifyCurrentQuestion();
      } else {
        SoundFX.click();
        if (currentQuestionIndex < BENCHMARK_QUESTIONS.length - 1) {
          currentQuestionIndex++;
          saveStateToStorage();
          renderCurrentQuestion();
        } else {
          window.location.href = 'index.html';
        }
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function openLightbox(src, title) {
      const lightbox = document.getElementById('image-lightbox');
      const img = document.getElementById('image-lightbox-img');
      const titleEl = document.getElementById('image-lightbox-title');
      if (!lightbox || !img) return;
      img.src = src;
      if (titleEl) {
        titleEl.textContent = title || 'Đối chiếu đáp án PDF';
      }
      lightbox.classList.add('active');
    }
    window.openLightbox = openLightbox;

    function closeLightbox() {
      const lightbox = document.getElementById('image-lightbox');
      const img = document.getElementById('image-lightbox-img');
      if (!lightbox) return;
      lightbox.classList.remove('active');
      if (img) img.src = '';
    }
    window.closeLightbox = closeLightbox;

    // App initialization
    document.addEventListener('DOMContentLoaded', () => {
      loadStateFromStorage();
      renderCurrentQuestion();
      initMapHoverPreview();
      SoundFX.renderUI();
      SoundFX.initVolumeSlider();

      // One-time iOS Safari audio unlock on first user interaction
      function setupIOSAudioUnlock() {
        const events = ['touchstart', 'pointerdown', 'click'];
        const unlock = () => {
          SoundFX.init();
          events.forEach(evt => document.removeEventListener(evt, unlock, true));
        };
        events.forEach(evt => document.addEventListener(evt, unlock, { once: true, capture: true }));
      }
      setupIOSAudioUnlock();

      // Touch-Friendly Sound Toggle
      const btnSound = document.getElementById('btn-sound-toggle');
      const soundWrapper = document.getElementById('sound-action-wrapper');
      const soundPopover = document.getElementById('sound-volume-popover');
      if (btnSound) {
        btnSound.addEventListener('click', (e) => {
          const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
          if (isTouch && soundPopover) {
            e.stopPropagation();
            if (!soundPopover.classList.contains('is-open')) {
              soundPopover.classList.add('is-open');
              SoundFX.click();
              return;
            }
          }
          SoundFX.toggleMute();
        });
      }

      const btnProof = document.getElementById('btn-proof-image');
      if (btnProof) {
        btnProof.addEventListener('click', () => {
          SoundFX.click();
          const curQ = BENCHMARK_QUESTIONS[currentQuestionIndex];
          if (curQ) {
            const proofSrc = 'images/proofs/proof_' + curQ.id + '.png';
            const cleanTitle = curQ.title ? curQ.title.split(':')[0] : ('Câu ' + curQ.id);
            openLightbox(proofSrc, 'Đối chiếu đáp án PDF: ' + cleanTitle);
          }
        });
      }

      const btnCloseLb = document.getElementById('btn-close-lightbox');
      if (btnCloseLb) {
        btnCloseLb.addEventListener('click', (e) => {
          e.stopPropagation();
          SoundFX.click();
          closeLightbox();
        });
      }

      // Touch-Friendly Map Popover Toggle
      const btnMap = document.getElementById('btn-map-toggle');
      const mapWrapper = document.getElementById('map-action-wrapper');
      const mapPopover = document.getElementById('map-popover');
      if (btnMap && mapPopover) {
        btnMap.addEventListener('click', (e) => {
          e.stopPropagation();
          SoundFX.click();
          mapPopover.classList.toggle('is-open');
        });
      }

      if (mapPopover) {
        mapPopover.addEventListener('click', (e) => {
          if (e.target && e.target.closest && e.target.closest('.map-cell')) {
            mapPopover.classList.remove('is-open');
          }
        });
      }

      // Tap outside to close popovers on touch devices
      document.addEventListener('click', (e) => {
        if (soundWrapper && !soundWrapper.contains(e.target) && soundPopover) {
          soundPopover.classList.remove('is-open');
        }
        if (mapWrapper && !mapWrapper.contains(e.target) && mapPopover) {
          mapPopover.classList.remove('is-open');
        }
      });

      // Swipe Gestures on Mobile Question Card
      function setupSwipeGestures() {
        const card = document.getElementById('question-card');
        if (!card) return;

        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;

        card.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          const target = e.target;
          if (target && target.closest && (target.closest('.code-box') || target.closest('.code-line') || target.closest('pre'))) {
            const codeEl = target.closest('.code-box') || target.closest('pre');
            if (codeEl && codeEl.scrollWidth > codeEl.clientWidth) {
              return; // Allow horizontal code scrolling
            }
          }
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        }, { passive: true });

        card.addEventListener('touchend', (e) => {
          if (!touchStartX || !touchStartTime) return;
          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;
          const deltaX = touchEndX - touchStartX;
          const deltaY = touchEndY - touchStartY;
          const elapsedTime = Date.now() - touchStartTime;

          touchStartX = 0;
          touchStartY = 0;
          touchStartTime = 0;

          if (elapsedTime < 500 && Math.abs(deltaX) > 75 && Math.abs(deltaY) < 40) {
            if (deltaX < 0) {
              // Swipe Left -> Next Question
              if (isAnswerVerified) {
                handleMainAction();
              } else if (currentQuestionIndex < BENCHMARK_QUESTIONS.length - 1) {
                goToQuestion(currentQuestionIndex + 1);
              }
            } else {
              // Swipe Right -> Previous Question
              if (currentQuestionIndex > 0) {
                goToQuestion(currentQuestionIndex - 1);
              }
            }
          }
        }, { passive: true });
      }
      setupSwipeGestures();

      const btnMainAction = document.getElementById('btn-main-action');
      if (btnMainAction) {
        btnMainAction.addEventListener('click', handleMainAction);
      }

      const btnPrev = document.getElementById('btn-prev-question');
      if (btnPrev) {
        btnPrev.addEventListener('click', () => {
          if (currentQuestionIndex > 0) {
            goToQuestion(currentQuestionIndex - 1);
          }
        });
      }

      const btnResetExam = document.getElementById('btn-reset-exam');
      if (btnResetExam) {
        btnResetExam.addEventListener('click', resetExam);
      }

      const btnResetAll = document.getElementById('btn-reset-all');
      if (btnResetAll) {
        btnResetAll.addEventListener('click', resetExam);
      }

      const btnTimer = document.getElementById('btn-timer-toggle');
      if (btnTimer) {
        btnTimer.addEventListener('click', toggleTimer);
      }

      startTimer();

      const lightbox = document.getElementById('image-lightbox');
      if (lightbox) {
        lightbox.addEventListener('click', (e) => {
          if (e.target === lightbox) {
            closeLightbox();
          }
        });
      }

      // Keyboard Navigation
      document.addEventListener('keydown', (e) => {
        const targetTag = e.target && e.target.tagName;
        if (targetTag === 'INPUT' || targetTag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) {
          return;
        }

        const lb = document.getElementById('image-lightbox');
        if (e.key === 'Escape') {
          if (lb && lb.classList.contains('active')) {
            closeLightbox();
            return;
          }
          const mapPopover = document.getElementById('map-popover');
          if (mapPopover && mapPopover.classList.contains('active')) {
            mapPopover.classList.remove('active');
            return;
          }
        }

        if (e.key === 'p' || e.key === 'P' || e.key === 'i' || e.key === 'I') {
          if (lb && lb.classList.contains('active')) {
            closeLightbox();
          } else {
            const btnProofEl = document.getElementById('btn-proof-image');
            if (btnProofEl) btnProofEl.click();
          }
          return;
        }

        if (lb && lb.classList.contains('active')) return;

        const q = BENCHMARK_QUESTIONS[currentQuestionIndex];
        if (!q) return;

        // Keys 1-7 or A-G for options
        const keyUpper = e.key.toUpperCase();
        let optionIndex = -1;
        if (e.key >= '1' && e.key <= '7') {
          optionIndex = parseInt(e.key, 10) - 1;
        } else if (keyUpper >= 'A' && keyUpper <= 'G') {
          optionIndex = keyUpper.charCodeAt(0) - 65;
        }

        if (optionIndex >= 0 && q.options && optionIndex < q.options.length) {
          if (!isAnswerVerified) {
            const opt = q.options[optionIndex];
            const row = document.querySelector(`.option-row[data-label="${opt.label}"]`);
            if (row) {
              row.click();
            }
          }
          return;
        }

        // Enter: Main action if not disabled
        if (e.key === 'Enter') {
          const btnMain = document.getElementById('btn-main-action');
          if (btnMain && !btnMain.disabled) {
            e.preventDefault();
            handleMainAction();
          }
          return;
        }

        // ArrowLeft: Previous question
        if (e.key === 'ArrowLeft') {
          if (currentQuestionIndex > 0) {
            e.preventDefault();
            goToQuestion(currentQuestionIndex - 1);
          }
          return;
        }

        // ArrowRight: Next question
        if (e.key === 'ArrowRight') {
          if (currentQuestionIndex < BENCHMARK_QUESTIONS.length - 1) {
            e.preventDefault();
            goToQuestion(currentQuestionIndex + 1);
          }
          return;
        }
      });
    });
  </script>
</body>
</html>
